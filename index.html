<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About Me · Friends</title>
<style>
:root{--bg:#0f1a2b;--card:#16253d;--ink:#e8eef7;--mute:#8fa3bf;--acc:#4fc3b0;--acc2:#3aa896;--line:#2a3d5c;--chip:#1d3050}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{text-align:center;padding:calc(26px + env(safe-area-inset-top,0px)) 16px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:700 2rem Georgia,serif;color:var(--acc)}header p{margin:4px 0 0;color:var(--mute)}
main{max-width:900px;margin:0 auto;padding:18px 14px 60px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,textarea{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.bar input{flex:1;min-width:180px;width:auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#0f1a2b;padding:9px 16px;font-weight:700}
button.ghost{background:transparent;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:400;text-align:left;padding:16px;border-radius:12px;width:100%}
.card:hover{border-color:var(--acc)}.card h3{margin:0;font:700 1.2rem Georgia,serif;color:var(--acc)}.card small{color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel h2{margin:0;font:700 1.8rem Georgia,serif;color:var(--acc)}.sub{color:var(--mute)}
h4{margin:22px 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;border-bottom:1px solid var(--line);padding-bottom:4px}
dl{margin:0;display:grid;grid-template-columns:minmax(130px,max-content) 1fr;gap:6px 16px}dt{color:var(--mute)}dd{margin:0;word-break:break-word}
pre{font:inherit;white-space:pre-wrap;margin:0}
details{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:0 14px}summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--acc)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding-bottom:14px}.form label{font-size:.85rem;color:var(--mute)}.full{grid-column:1/-1}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.empty,.note{color:var(--mute);padding:24px 10px;text-align:center}.note{background:var(--chip);border-radius:10px;padding:10px 14px;text-align:left;margin:0 0 14px}
@media(max-width:560px){.form{grid-template-columns:1fr}dl{grid-template-columns:1fr}}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0 20px}
.door{position:relative;min-height:300px;border:3px solid var(--acc);border-radius:100px 100px 8px 8px;background:linear-gradient(#1d3050,#16253d);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 8px;text-align:center}
.door:hover{background:linear-gradient(#24406a,#1b2f4d)}.door b{font:700 1.1rem Georgia,serif}.door small{color:var(--mute);font-weight:400}.dn{font-size:2.4rem}
.knob{position:absolute;right:14px;top:58%;width:12px;height:12px;border-radius:50%;background:#e0b04a}
.pin{max-width:380px;margin:0 auto}
@media(max-width:560px){.door{min-height:200px;border-radius:60px 60px 6px 6px}.door b{font-size:.9rem}.dn{font-size:1.8rem}.knob{right:8px}}
</style></head><body>
<header><h1>✨ About Me</h1><p>Choose your door</p></header>
<main id="app"><div class="empty">Loading…</div></main>
<script>
// === PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES ===
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxf7vIfQ4cBK0Ik_4SeLfFFQt1N6S90u1tSxGNpxK_-LK59W1zdkOqxAckyiG5_It-bJw/exec";
const SEC=[
["Bio","🪪","Name's meaning;Nickname;Age;From;Live @;Height;MBTI;Western sign;Eastern sign;Shoe size;Piercings / tattoos;Competitive?"],
["Food & Drinks","🍕","Food;Sushi;Pizza toppings;Drink;Starbucks drink;Snack;Candy;Cake;Chip;Ice cream flavor;Alcoholic beverage;Fast-food restaurant;Dining restaurant"],
["TV & Movies","🎬","TV sitcom;Cartoon;Anime;Actors;Actresses;Movies;Chick flick;Love stories;Marvel movie;TV show;Canceled series"],
["Music","🎵","Song of all time;Song right now;Band;Solo artist;Dance style;Genres;Boy band;Guilty-pleasure song;Musical;Instrument"],
["Travel & Recreation","🧭","States visited;Favorite state;Countries visited;Favorite country;Car;Car color;Theme park"],
["Nature & Animals","🌲","Animal;Cat or dog;Dog breed;Cat breed;Bird;Flower / plant;Season;Weather"],
["Sports","🏅","Sport;Olympic sport;Athletes"],
["Childhood & School","🎒","Board / card game;Favorite age;Favorite subject;Worst subject;Power Ranger;Childhood toy"],
["Hobbies & Fandoms","🎮","Top 3 hobbies;Computer game;Video game;Pokemon;DC superhero;Marvel superhero;Superpower;Book series"],
["Wizarding World","⚡","Hogwarts house;Ivermorny house;Patronus;Wand"],
["Fashion & Beauty","👟","Clothing store;Shoe brand;Mall store;Hair style;Hair color;Sleepwear;Luxury brand;Makeup?"],
["Other","💫","Color;Scent;Sound;Least favorite sound;Holiday;Day of the week;Time of day;Baby boy name;Baby girl name;Piece of art;Quote;Dream career;Life goals;Person you look up to;Hidden talents;Bad habits"]
].map(([t,e,f])=>({t,e,f:f.split(";")}));
// Open the page with ?seed=1 and click "Add my profile" to start from Sonny's answers.
const SEED={vals:{"Name's meaning":"Celtic name, gg-grandfather name is James, king James","Nickname":"Boo, James, Walter","From":"Saint David, all over Utah","Live @":"Saratoga Springs","Height":"6'1\"","MBTI":"INFP-A","Western sign":"Leo","Eastern sign":"Water Rooster","Shoe size":"11.5","Piercings / tattoos":"None at the moment","Competitive?":"Except card games",
"Food":"Steak","Sushi":"Sake marinated crab roll","Pizza toppings":"Chicken","Drink":"Mountain Dew","Starbucks drink":"Caramel Ribbon frappe","Snack":"Soft pretzels","Candy":"Red hots","Cake":"Cheesecake","Chip":"Baked Ruffles cheddar and sour cream","Ice cream flavor":"Play-doh / cotton candy","Alcoholic beverage":"N/A","Fast-food restaurant":"Chick-Fil-A",
"Song of all time":"Stable Song - Gregory Allen Isokov","Song right now":"Wings of Time - Tame Impala","Band":"Lumineers","Solo artist":"Gregory Allen Isokov, Laureena McKeneth","Genres":"Folk, indie, Celtic","Boy band":"Backstreet Boys","Musical":"Chess","Instrument":"Bagpipe",
"Favorite state":"Utah","Car":"Mercedes Black Series, 1940 Dodge Power Wagon","Animal":"Rocky Mountain elk","Cat or dog":"Dog","Dog breed":"Utanogan","Cat breed":"Scottish munchkin fold","Bird":"Raven","Flower / plant":"Thistle","Season":"Fall","Weather":"Rain","Favorite subject":"History",
"DC superhero":"Beast Boy","Marvel superhero":"Doctor Strange / Deadpool","Superpower":"Time manipulation","Hogwarts house":"Hufflepuff","Patronus":"Fox",
"Color":"Dark steel blue / navy","Scent":"Seaside mountain grass air","Sound":"Wind through the forest, creaking trees","Least favorite sound":"Retching, mud plopping, baby screeching","Holiday":"Halloween","Day of the week":"Friday night"}};
const app=document.getElementById("app");
let profiles=[],view={mode:"list"},q="",d=null,state="loading";
const GROUPS=[{id:"alder",name:"Alder Group",e:"🌲"},{id:"byui",name:"BYUI & Extended",e:"🎓"},{id:"wilson",name:"Wilson Family",e:"🏡"}];
let group=null,gpin="",pend=null,homeMsg="";
function lock(){group=null;gpin="";profiles=[];view={mode:"list"};pend=null;q=""}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(b){const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...b,group:group&&group.id,gpin})});return r.json()}
async function load(){
  if(!SCRIPT_URL){state="nourl";return render()}
  if(!group){state="ok";return render()}
  try{const j=await api({action:"list"});if(j.error){lock();homeMsg=j.error;state="ok";return render()}profiles=j.sort((a,b)=>a.name.localeCompare(b.name));state="ok"}catch(e){state="err"}
  render();
}
function render(){
  if(state==="loading")return app.innerHTML='<div class="empty">Loading…</div>';
  if(state==="nourl")return app.innerHTML='<div class="empty">Setup needed: add your Apps Script URL at the top of the script in index.html.</div>';
  if(state==="err"){app.innerHTML='<div class="empty">Couldn’t load profiles. <button class="ghost" id="rt">Back to doors</button></div>';document.getElementById("rt").onclick=()=>{lock();state="ok";render()};return}
  if(!group)return home();
  if(view.mode==="edit")return edit();if(view.mode==="detail")return detail();list();
}
function home(){
  app.innerHTML=`${homeMsg?`<p class="note">${esc(homeMsg)}</p>`:""}<div class="doors">${GROUPS.map(g=>`<button class="door" data-g="${g.id}"><span class="knob"></span><span class="dn">${g.e}</span><b>${esc(g.name)}</b><small>🔒 Locked</small></button>`).join("")}</div>
  ${pend?`<div class="panel pin"><h2>${esc(pend.name)}</h2><p class="sub">Enter the group PIN to come in.</p><input id="gp" type="password" inputmode="numeric" maxlength="12" autocomplete="off"><div class="row"><button id="go">Open door</button><button class="ghost" id="no">Cancel</button></div></div>`:""}`;
  app.querySelectorAll(".door").forEach(b=>b.onclick=()=>{pend=GROUPS.find(g=>g.id===b.dataset.g);homeMsg="";home();document.getElementById("gp").focus()});
  const go=document.getElementById("go");if(!go)return;
  const enter=()=>{const v=document.getElementById("gp").value.trim();if(!v)return;group=pend;gpin=v;pend=null;homeMsg="";state="loading";render();load()};
  go.onclick=enter;document.getElementById("gp").onkeydown=e=>{if(e.key==="Enter")enter()};
  document.getElementById("no").onclick=()=>{pend=null;home()};
}
function list(){
  const l=profiles.filter(p=>(p.name+" "+((p.vals||{}).Nickname||"")).toLowerCase().includes(q.toLowerCase()));
  app.innerHTML=`<div class="bar"><input id="s" type="search" placeholder="Search by name or nickname…" value="${esc(q)}"><button class="ghost" id="lock">🔒 ${esc(group.name)}</button><button id="new">Add my profile</button></div>
  ${l.length?`<div class="grid">${l.map(p=>{const v=p.vals||{};return`<button class="card" data-n="${esc(p.name)}"><h3>${esc(p.name)}</h3><small>${esc(v.Nickname?"aka "+v.Nickname:"")}${v.Nickname&&v["Live @"]?" · ":""}${esc(v["Live @"]||"")}</small></button>`}).join("")}</div>`:`<div class="empty">${profiles.length?"No matches.":"No profiles yet. Be the first!"}</div>`}`;
  const s=document.getElementById("s");s.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;list();const n=document.getElementById("s");n.focus();n.setSelectionRange(p,p)};
  document.getElementById("new").onclick=()=>start(/seed=1/.test(location.search)?SEED:{});
  document.getElementById("lock").onclick=()=>{lock();render()};
  app.querySelectorAll(".card").forEach(c=>c.onclick=()=>{view={mode:"detail",n:c.dataset.n};render();scrollTo(0,0)});
}
function detail(){
  const p=profiles.find(x=>x.name===view.n);if(!p){view={mode:"list"};return render()}
  const v=p.vals||{};
  const body=SEC.map(s=>{const f=s.f.filter(k=>v[k]);return f.length?`<h4>${s.e} ${esc(s.t)}</h4><dl>${f.map(k=>`<dt>${esc(k)}</dt><dd>${esc(v[k])}</dd>`).join("")}</dl>`:""}).join("");
  app.innerHTML=`<div class="bar"><button class="ghost" id="back">← Everyone</button></div><div class="panel"><h2>${esc(p.name)}</h2>${v.Nickname?`<div class="sub">aka ${esc(v.Nickname)}</div>`:""}
  ${body}
  <div class="row"><button id="ed">Edit this profile</button></div></div>`;
  document.getElementById("back").onclick=()=>{view={mode:"list"};render()};
  document.getElementById("ed").onclick=()=>start(p);
}
function start(p){d={name:p.name||"",pin:"",locked:!!p.name,vals:{...(p.vals||{})}};view={mode:"edit"};render();scrollTo(0,0)}
function edit(){
  app.innerHTML=`<div class="bar"><button class="ghost" id="cancel">← Cancel</button></div><div class="panel"><h2>${d.locked?"Edit profile":"My profile"}</h2>
  <p class="note">Only people in ${esc(group.name)} can see this. Fill in only what you like; blanks are hidden. Pick a personal PIN (3+ characters) so only you can change your profile later.</p>
  <div class="form"><div><label>Name</label><input data-n="1" maxlength="60" value="${esc(d.name)}" ${d.locked?"readonly":""}></div>
  <div><label>Your PIN ${d.locked?"(enter yours to save)":"(make one up)"}</label><input data-pin="1" type="password" maxlength="20" autocomplete="off"></div></div>
  ${SEC.map((s,i)=>`<details ${i===0?"open":""}><summary>${s.e} ${esc(s.t)}</summary><div class="form">${s.f.map(k=>`<div><label>${esc(k)}</label><input data-f="${esc(k)}" maxlength="200" value="${esc(d.vals[k]||"")}"></div>`).join("")}</div></details>`).join("")}
  <div class="row"><button id="save">Save profile</button>${d.locked?'<button class="ghost" id="del">Delete profile</button>':""}</div><p id="msg" class="note" hidden></p></div>`;
  app.querySelector("[data-n]").oninput=e=>d.name=e.target.value;
  app.querySelector("[data-pin]").oninput=e=>d.pin=e.target.value;
  app.querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>d.vals[i.dataset.f]=i.value);
  document.getElementById("cancel").onclick=()=>{view={mode:"list"};render()};
  document.getElementById("save").onclick=()=>send("save");
  const del=document.getElementById("del");if(del)del.onclick=()=>confirm("Delete this profile?")&&send("delete");
}
async function send(action){
  const m=document.getElementById("msg"),say=t=>{m.textContent=t;m.hidden=false};
  if(!d.name.trim())return say("Please add your name.");if(d.pin.length<3)return say("Please enter a PIN (3+ characters).");
  const vals={};Object.keys(d.vals).forEach(k=>{const x=(d.vals[k]||"").trim();if(x)vals[k]=x});
  say("Saving…");
  try{
    const j=await api({action,name:d.name.trim(),pin:d.pin,profile:{vals}});if(j.error)return say(j.error);
    await load();view=action==="save"?{mode:"detail",n:d.name.trim()}:{mode:"list"};render();scrollTo(0,0);
  }catch(e){say("Couldn’t save. Check your connection and try again.")}
}
load();
</script></body></html>
